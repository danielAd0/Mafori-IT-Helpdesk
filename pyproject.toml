# Settings for Ruff, the linter and formatter everyone runs before committing:
#   ruff check .
#   ruff format .
[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["*/migrations/*"]   # generated by Django, never hand-edited

[tool.ruff.lint]
# E/W style, F real bugs, I import order, B likely bugs, UP modern Python, DJ Django rules
select = ["E", "W", "F", "I", "B", "UP", "DJ"]
# The formatter handles line length; long strings and URLs are fine
ignore = ["E501"]

[tool.mypy]
ignore_missing_imports = true